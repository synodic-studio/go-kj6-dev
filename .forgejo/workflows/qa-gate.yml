name: QA Gate

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  check-label:
    runs-on: codeberg-tiny
    steps:
      - name: Check for required labels
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          MISSING=""
          for required in ci-pass qa-pass; do
            FOUND=false
            for label in $LABELS; do
              if [ "$label" = "$required" ]; then
                FOUND=true
                break
              fi
            done
            if [ "$FOUND" != "true" ]; then
              MISSING="$MISSING $required"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing required labels:$MISSING"
            exit 1
          fi
          echo "All required labels present: ci-pass, qa-pass"
