name: QA Gate

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  check-label:
    runs-on: codeberg-tiny
    steps:
      - name: Check for qa-pass label
        run: |
          FOUND=false
          for label in ${{ join(github.event.pull_request.labels.*.name, ' ') }}; do
            if [ "$label" = "qa-pass" ]; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = "true" ]; then
            echo "qa-pass label found"
          else
            echo "Missing required label: qa-pass"
            exit 1
          fi
