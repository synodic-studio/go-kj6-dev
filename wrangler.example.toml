# Copy this file to `wrangler.toml` and fill in your own values.
# `wrangler.toml` itself is gitignored — it carries the project name and
# (optionally) the KV namespace id used by the /key routes.
#
# This deploys as a Cloudflare PAGES project (direct upload, advanced mode:
# `npm run build` copies src/worker.js -> dist/_worker.js), NOT a Worker.
# Deploy:  npm run deploy   (build + wrangler pages deploy dist)

name = "patchbay-go"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"

# Optional. Required only if you want the /key routes.
# Create the namespace with:
#   npx wrangler kv namespace create VAULT
# then paste the returned `id` here.
#
# [[kv_namespaces]]
# binding = "VAULT"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
